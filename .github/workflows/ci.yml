name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Fuzz smoke test (10s per target)
        run: |
          go test -run '^$' -fuzz FuzzParsePorts -fuzztime 10s .
          go test -run '^$' -fuzz FuzzParseTargets -fuzztime 10s .
          go test -run '^$' -fuzz FuzzCleanBanner -fuzztime 10s .
